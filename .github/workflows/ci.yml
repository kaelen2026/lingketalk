name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一分支上的新推送取消仍在跑的旧任务。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # 读取 package.json 的 packageManager 字段，版本与本地一致。
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check types
        run: pnpm check-types

      # pnpm test 经 Turborepo 依赖 build，构建失败同样会在这里暴露。
      - name: Test
        run: pnpm test
